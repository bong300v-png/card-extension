<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardFill Pro</title>
  <link rel="stylesheet" href="popup.css">
  <script>
    // Apply saved theme before paint to avoid FOUC (Flash Of Unstyled Content)
    try {
      var t = localStorage.getItem('cf_theme');
      if (t === 'dark') document.documentElement.classList.add('dark-mode');
    } catch (_) {}
  </script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header" role="banner">
      <span class="logo" aria-hidden="true">💳</span>
      <span class="brand" data-i18n="appName">CARDFILL PRO</span>
      <div class="header-right">
        <button class="badge lang-badge" id="langBadge" type="button"
                title="Switch language" aria-label="Switch language">EN</button>
        <button class="icon-btn" id="themeBtn" type="button"
                title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- BIN Input -->
    <div class="field-group">
      <label class="label" for="binInput">
        <span class="label-icon" aria-hidden="true">🏦</span>
        <span data-i18n="enterBin">Enter BIN</span>
      </label>
      <input type="text" id="binInput" class="input"
             data-i18n-placeholder="binPlaceholder"
             placeholder="Enter BIN (6–9 digits)"
             maxlength="19" autocomplete="off" inputmode="numeric"
             aria-describedby="binHelp">
    </div>

    <!-- Checkboxes -->
    <div class="checkbox-row" role="group" aria-label="Generation options">
      <label class="cb-label">
        <input type="checkbox" id="dateAuto" checked>
        <span class="cb-box" aria-hidden="true"></span>
        <span class="cb-icon" aria-hidden="true">📅</span>
        <span data-i18n="date">Date</span>
      </label>
      <label class="cb-label">
        <input type="checkbox" id="cvvAuto" checked>
        <span class="cb-box" aria-hidden="true"></span>
        <span class="cb-icon" aria-hidden="true">🔒</span>
        <span data-i18n="cvv">CVV</span>
      </label>
      <label class="cb-label">
        <input type="checkbox" id="randomMode">
        <span class="cb-box" aria-hidden="true"></span>
        <span class="cb-icon" aria-hidden="true">🎲</span>
        <span data-i18n="random">Random</span>
      </label>
    </div>

    <!-- Manual Date/CVV Row -->
    <div class="manual-row" id="manualRow">
      <div class="mini-field">
        <label class="mini-label" for="monthInput">
          <span aria-hidden="true">📅</span>
          <span data-i18n="month">Month</span>
        </label>
        <input type="text" id="monthInput" class="input mini"
               placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off">
      </div>
      <div class="mini-field">
        <label class="mini-label" for="yearInput">
          <span aria-hidden="true">📅</span>
          <span data-i18n="year">Year</span>
        </label>
        <input type="text" id="yearInput" class="input mini"
               placeholder="YY" maxlength="2" inputmode="numeric" autocomplete="off">
      </div>
      <div class="mini-field">
        <label class="mini-label" for="cvvInput">
          <span aria-hidden="true">🔥</span>
          <span data-i18n="cvv">CVV</span>
        </label>
        <input type="text" id="cvvInput" class="input mini"
               placeholder="123" maxlength="4" inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <!-- Qty + Country Row -->
    <div class="two-col">
      <div class="field-group">
        <label class="label" for="qtyInput">
          <span class="label-icon" aria-hidden="true">🔢</span>
          <span data-i18n="qty">Qty</span>
        </label>
        <input type="number" id="qtyInput" class="input"
               value="1" min="1" max="50" inputmode="numeric">
      </div>
      <div class="field-group two-col-wide">
        <label class="label" for="countrySelect">
          <span class="label-icon" aria-hidden="true">🌍</span>
          <span data-i18n="selectCountry">Select Country</span>
        </label>
        <select id="countrySelect" class="input select">
          <option value="US">🇺🇸 United States</option>
          <option value="ES" selected>🇪🇸 Spain</option>
          <option value="GB">🇬🇧 United Kingdom</option>
          <option value="FR">🇫🇷 France</option>
          <option value="DE">🇩🇪 Germany</option>
          <option value="IT">🇮🇹 Italy</option>
          <option value="CA">🇨🇦 Canada</option>
          <option value="AU">🇦🇺 Australia</option>
          <option value="BR">🇧🇷 Brazil</option>
          <option value="MX">🇲🇽 Mexico</option>
          <option value="JP">🇯🇵 Japan</option>
          <option value="NL">🇳🇱 Netherlands</option>
          <option value="SG">🇸🇬 Singapore</option>
          <option value="VN">🇻🇳 Vietnam</option>
          <option value="TH">🇹🇭 Thailand</option>
        </select>
      </div>
    </div>

    <!-- Action Buttons Row 1 -->
    <div class="btn-row">
      <button class="btn btn-gen" id="generateBtn" type="button">
        <span aria-hidden="true">⚡</span> <span data-i18n="generate">Generate</span>
      </button>
      <button class="btn btn-validate" id="validateBtn" type="button">
        <span aria-hidden="true">✅</span> <span data-i18n="validate">Validate</span>
      </button>
      <button class="btn btn-bin" id="binCheckBtn" type="button">
        <span aria-hidden="true">🔍</span> <span data-i18n="binCheck">BIN Check</span>
      </button>
    </div>

    <!-- Action Buttons Row 2 -->
    <div class="btn-row">
      <button class="btn btn-fill" id="genFillBtn" type="button">
        <span aria-hidden="true">🔥</span> <span data-i18n="genFill">GEN &amp; FILL</span>
      </button>
      <button class="btn btn-genonly" id="clearBtn" type="button"
              aria-label="Clear results">
        <span aria-hidden="true">🧹</span> <span data-i18n="clear">Clear</span>
      </button>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar" role="status" aria-live="polite"></div>

    <!-- Results -->
    <div class="results" id="results"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
